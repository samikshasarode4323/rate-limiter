services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app1:
    build: .
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  app2:
    build: .
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  app3:
    build: .
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3